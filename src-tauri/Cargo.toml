[package]
name = "cc-terminal"
version = "0.0.1"
description = "桌面 Agent 编排客户端 — Codex-style agent orchestration for Claude"
authors = ["liwenzhong <liwenzhonhg@gmail.com>"]
edition = "2021"

[lib]
name = "cc_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2.7.0"
serde_yaml = "0.9"
